version: '3.8'
services:
  cyber-sentinel:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DATABASE_URL=sqlite:///./cyber_sentinel.db
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - cyber-sentinel
    restart: unless-stopped

volumes:
  db-data:
